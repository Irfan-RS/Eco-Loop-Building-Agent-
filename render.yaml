services:
  - type: web
    name: ecoloop-building-agent
    env: python
    buildCommand: |
      curl -sSL https://github.com/NREL/EnergyPlus/releases/download/v26.1.0/EnergyPlus-26.1.0-6f2e40d102-Linux-ubuntu22.04-x86_64.tar.gz | tar -xz -C /tmp && \
      pip install --upgrade pip setuptools wheel && \
      pip install -r requirements.txt && \
      cd frontend && npm install && npm run build
    startCommand: python server/api_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
